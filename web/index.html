<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="OtoDNA Kurumsal Ağı ve Dijital Referans Platformu.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OtoDNA Kurumsal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OtoDNA - Dijital Referans Platformu</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #F4F6F8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Avenir', sans-serif;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(0, 90, 100, 0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #005A64;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #005A64;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
<div class="loading-container">
  <div class="spinner"></div>
  <div class="loading-text">OTODNA YÜKLENİYOR...</div>
</div>
<script>
  window.addEventListener('flutter-first-frame', function() {
    document.querySelector('.loading-container').style.display = 'none';
  });
</script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
