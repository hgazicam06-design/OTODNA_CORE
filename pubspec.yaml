name: otodna
description: OtoDNA - Kuantum Araç Ağı ve Dijital Referans Protokolü
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 🔥 FİREBASE MERKEZİ İSTİHBARAT ZIRHLARI
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.3
  firebase_storage: ^12.1.2

  # 👁️ SİBER GÖZ VE TARAMA ÜNİTELERİ (QR & ML)
  mobile_scanner: ^5.1.1
  google_mlkit_text_recognition: ^0.13.0
  qr_flutter: ^4.1.0
  camera: ^0.11.0+1
  image_picker: ^1.1.2

  # 🧠 KUANTUM ZEKA VE VERİ YÖNETİMİ
  flutter_riverpod: ^2.5.1
  google_generative_ai: ^0.4.4
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.3

  # 📍 LOKASYON VE İLETİŞİM PROTOKOLLERİ
  geolocator: ^12.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  http: ^1.6.0

  # 🎙️ SESLİ KOMUT VE ERİŞİLEBİLİRLİK
  flutter_tts: ^4.0.2
  speech_to_text: ^7.3.0

  # 📂 SİBER MÜHÜRLÜ RAPORLAMA (PDF & PAYLAŞIM)
  pdf: ^3.10.8
  open_file: ^3.3.2
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path: ^1.9.0

  # 🎨 GÖRSEL İŞÇİLİK VE FORMATLAMA
  flutter_markdown: ^0.7.2
  intl: ^0.19.0
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icon.png"